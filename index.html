<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Checker</title>
<style>
:root{
  --bg:#050505;
  --panel:#0b0b0d;
  --line:#1b1b1f;
  --muted:#77777f;
  --text:#f5f5f7;
  --accent:#f0f0f0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.045),transparent 32%),
    #050505;
  color:var(--text);
}
.card{
  width:min(92vw,420px);
  padding:32px;
  background:rgba(11,11,13,.94);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 25px 90px rgba(0,0,0,.55);
}
.brand{
  text-align:center;
  font-size:26px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:28px;
}
.label{
  display:block;
  margin:0 0 9px;
  font-size:13px;
  color:#b9b9bf;
}
input{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:8px;
  border:1px solid #242429;
  outline:none;
  background:#070709;
  color:#fff;
  font-size:14px;
  letter-spacing:.03em;
  transition:.2s;
}
input:focus{
  border-color:#505057;
  box-shadow:0 0 0 3px rgba(255,255,255,.04);
}
button{
  width:100%;
  height:48px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  background:#f1f1f1;
  color:#050505;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
  transition:.15s;
}
button:hover{background:#fff;transform:translateY(-1px)}
button:active{transform:translateY(0)}
.help{
  margin-top:18px;
  text-align:center;
  color:#696970;
  font-size:12px;
}
#result{
  display:none;
  margin-top:16px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:13px;
  line-height:1.45;
}
.ok{display:block!important;background:#0b1710;color:#b7f7c5;border-color:#17371f!important}
.bad{display:block!important;background:#180c0c;color:#ffb7b7;border-color:#3b1818!important}
.info{display:block!important;background:#101015;color:#c7c7d0}
@media(max-width:480px){
  .card{padding:24px}
  .brand{font-size:23px}
}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">AIMHACK</div>

    <label class="label" for="key">access key</label>
    <input id="key" maxlength="20" placeholder="AMHK-XXXX-XXXX-XXXX"
           autocomplete="off" spellcheck="false"
           onkeydown="if(event.key==='Enter') checkKey()">

    <button type="button" onclick="checkKey()">unlock</button>

    <div id="result" role="status"></div>

    <div class="help">no key? contact your seller.</div>
  </main>
</body>
</html>
